name: Build Docker Images
on:
  push:
    branches:
      - 'master'
    paths:
      - 'dmoj/**'
  pull_request:
  workflow_dispatch:
    inputs:
      push_base:
        description: 'Push the base image to GHCR before tests'
        required: false
        type: boolean
  schedule:
    - cron: '0 0 * * 1' # Every Monday @ midnight

jobs:
  build:
    permissions:
      packages: write
      actions: write # re-dispatch after pushing base
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch repo
        uses: actions/checkout@v4
        with:
          repository: 'mcpt/wlmoj'
          path: 'dmoj/repo'

      - name: Setup submodules
        run: git submodule update --init --recursive
        working-directory: dmoj/repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: docker buildx bake --file docker-build.yml --file ../docker-build-cache.json
        working-directory: dmoj

      - name: Push base then re-run workflow
        if: github.event.inputs.push_base == 'true'
        run: |
          docker push ghcr.io/mcpt/wlmoj-base:latest
          curl -fsS -X POST \
           -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
           -H "Accept: application/vnd.github.v3+json" \
           https://api.github.com/repos/${{ github.repository }}/actions/workflows/docker.yml/dispatches \
           -d '{"ref": "${{ github.ref_name }}"}'
          

      - name: Test images
        id: test
        run: |
          echo "Starting containers"
          ./scripts/initialize
          docker compose -f docker-build.yml up -d 
          docker ps -a 
          sleep 15
          export COMPOSE_EXEC_FLAGS="-T"
          export COMPOSE_FLAGS="-f docker-build.yml"
          echo "Static files"
          ./scripts/copy_static
          echo "Migrate"
          ./scripts/migrate
          echo "Loading data"
          ./scripts/manage loaddata language_small
        working-directory: dmoj

      - name: Log Failures
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        run: |
          docker compose -f docker-build.yml logs
        working-directory: dmoj

      - name: Push images to GHCR
        if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        # Also push a dated tag per build so a bad :latest can be rolled back with
        # docker service update --image ghcr.io/mcpt/wlmoj-<name>:<tag> wlmoj_<name>
        run: |
          TAG=$(date -u +%Y%m%d)-${{ github.run_number }}
          for i in base pdfoid site nginx mathoid texoid celery bridged wsevent; do
            docker tag ghcr.io/mcpt/wlmoj-$i:latest ghcr.io/mcpt/wlmoj-$i:$TAG
            docker push ghcr.io/mcpt/wlmoj-$i:latest
            docker push ghcr.io/mcpt/wlmoj-$i:$TAG
          done
          echo "Pushed tag $TAG" >> $GITHUB_STEP_SUMMARY

